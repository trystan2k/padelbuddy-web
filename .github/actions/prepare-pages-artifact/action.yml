name: Prepare Pages Artifact
description: Prepare a clean Cloudflare Pages artifact from dist/

inputs:
  source-directory:
    description: Directory containing the build output.
    required: false
    default: dist
  artifact-directory:
    description: Directory that will receive the deployable Pages artifact.
    required: false
    default: dist/pages

outputs:
  artifact-directory:
    description: Prepared Cloudflare Pages artifact directory.
    value: ${{ inputs.artifact-directory }}

runs:
  using: composite
  steps:
    - name: Prepare Cloudflare Pages artifact
      shell: bash
      env:
        SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
      run: |
        set -euo pipefail
        shopt -s dotglob nullglob

        if [[ ! -d "$SOURCE_DIRECTORY" ]]; then
          echo "Build output directory not found: $SOURCE_DIRECTORY" >&2
          exit 1
        fi

        rm -rf "$ARTIFACT_DIRECTORY"
        mkdir -p "$ARTIFACT_DIRECTORY"

        copied_entries=0

        for entry in "$SOURCE_DIRECTORY"/*; do
          name="$(basename "$entry")"

          case "$name" in
            .DS_Store|client|pages|server)
              continue
              ;;
          esac

          cp -R "$entry" "$ARTIFACT_DIRECTORY/"
          copied_entries=$((copied_entries + 1))
        done

        if [[ "$copied_entries" -eq 0 ]]; then
          echo "No deployable Pages assets were found in $SOURCE_DIRECTORY" >&2
          exit 1
        fi
