name: Deploy Production

on:
  release:
    types:
      - published

concurrency:
  group: deploy-production-${{ github.event.release.tag_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.32.0
  PRODUCTION_BRANCH: main

jobs:
  deploy_production:
    name: Deploy production
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.production_url.outputs.production_url }}
    steps:
      - name: Check out released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist/client
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            --branch=${{ env.PRODUCTION_BRANCH }}

      - name: Set production URL
        id: production_url
        shell: bash
        env:
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: echo "production_url=https://${PROJECT_NAME}.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Summarize production deployment
        env:
          PRODUCTION_URL: ${{ steps.production_url.outputs.production_url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Release: $RELEASE_TAG"
            echo "- URL: $PRODUCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
