name: Preview Release PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: preview-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.32.0
  PREVIEW_ALIAS: release-please-main

jobs:
  deploy_preview:
    name: Deploy release preview
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.preview_url.outputs.preview_url }}
    steps:
      - name: Check out release PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist/client
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            --branch=${{ env.PREVIEW_ALIAS }}

      - name: Set preview URL
        id: preview_url
        shell: bash
        env:
          PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          PREVIEW_ALIAS: ${{ env.PREVIEW_ALIAS }}
        run: echo "preview_url=https://${PREVIEW_ALIAS}.${PROJECT_NAME}.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the release PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: release-preview
          message: |
            Cloudflare Pages preview refreshed for the Release Please PR.

            Preview URL: ${{ steps.preview_url.outputs.preview_url }}

      - name: Summarize preview deployment
        env:
          PREVIEW_URL: ${{ steps.preview_url.outputs.preview_url }}
        run: |
          {
            echo "## Release preview"
            echo ""
            echo "- Preview URL: $PREVIEW_URL"
          } >> "$GITHUB_STEP_SUMMARY"
